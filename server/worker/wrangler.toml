name = "avesd-worker"
main = "build/index.js"
compatibility_date = "2026-11-21"

[build]
command = "worker-build --release"

[[durable_objects.bindings]]
name = "REGIONAL_FLYOVERS"
class_name = "RegionalFlyovers"

[[migrations]]
tag = "regional-flyovers-v1"
new_sqlite_classes = ["RegionalFlyovers"]

[vars]
EVENT_NEARBY_PERCENT = "70"
EVENT_DROP_PERCENT = "80"
