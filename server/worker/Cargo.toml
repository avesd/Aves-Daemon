[package]
name = "avesd-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
avesd-events = { path = "../../crates/avesd-events" }
avesd-core = { path = "../../crates/avesd-core", default-features = false }
worker = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
chrono-tz = "0.10"
sunrise = { version = "3", default-features = false, features = ["std"] }
futures-util = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
roxmltree = "0.21"
scraper = { version = "0.25", default-features = false }
