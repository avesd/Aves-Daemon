name: Release macOS

on:
  push:
    branches: [main]
    paths: [apps/macos/version.json]

permissions:
  contents: read

concurrency:
  group: publish-desktop
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Check the version transition
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          previous="$RUNNER_TEMP/previous.json"
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo '{"version":"0.0.0","build":1}' > "$previous"
          elif [[ -z "$(git ls-tree "$BEFORE" -- apps/macos/version.json)" ]]; then
            git cat-file -e "$BEFORE^{commit}"
            echo '{"version":"0.0.0","build":1}' > "$previous"
          else
            git show "$BEFORE:apps/macos/version.json" > "$previous"
          fi
          python3 - "$RUNNER_TEMP/previous.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          from pathlib import Path
          old = json.loads(Path(sys.argv[1]).read_text())
          new = json.loads(Path("apps/macos/version.json").read_text())
          def semver(value):
              if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", value):
                  raise ValueError("Expected stable MAJOR.MINOR.PATCH")
              return tuple(map(int, value.split(".")))
          if new["version"] != old["version"]:
              if semver(new["version"]) <= semver(old["version"]) or type(new["build"]) is not int or new["build"] <= old.get("build", 1):
                  raise ValueError("The release version and build must both increase")
              print("version=" + new["version"])
          PY

  build-macos:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: macos-26
    environment: macos-release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the project Xcode
        run: |
          developer="/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer"
          DEVELOPER_DIR="$developer" xcodebuild -version
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies and validate
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          pnpm install --frozen-lockfile
          make validate
      - name: Build the update-enabled application
        env:
          UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          : "${UPDATE_FEED_URL:?Configure UPDATE_FEED_URL in macos-release}"
          : "${UPDATE_PUBLIC_KEY:?Configure UPDATE_PUBLIC_KEY in macos-release}"
          make build-macos-release
      - name: Apply the configured macOS signing mode
        env:
          MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash scripts/release/sign-macos.sh
      - name: Sign the final archive and verify the feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/release/macos-appcast.sh
      - id: bundle
        run: echo "artifact-name=macos-$VERSION-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bundle.outputs.artifact-name }}
          path: |
            dist/*.zip
            dist/appcast.xml
            dist/notes.md
          if-no-files-found: error
          compression-level: 0
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact-name }}

  publish:
    needs: [prepare, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-macos.outputs.artifact }}
          path: dist
      - name: Publish the release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release/publish-macos.sh
