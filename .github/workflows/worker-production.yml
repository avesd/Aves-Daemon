name: Worker production

on:
  push:
    branches: [main]
    paths: [server/worker/version.json]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare Worker versions across the push
        id: compare
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=server/worker/version.json
          previous=0.0.0
          if [[ "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            files=$(git ls-tree --name-only "$BEFORE" -- "$manifest")
            if [[ -n "$files" ]]; then
              previous=$(git show "$BEFORE:$manifest" | jq -er '.version | strings')
            fi
          fi
          current=$(jq -er '.version | strings' "$manifest")
          if ! [[ "$current" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid Worker version, expected MAJOR.MINOR.PATCH."
            exit 1
          fi
          changed=false
          if [[ "$current" != "$previous" && "$current" != 0.0.0 ]]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "version=$current" >> "$GITHUB_OUTPUT"

  deploy:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: avesd-worker-production
    concurrency:
      group: avesd-worker-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test and package Worker
        run: |
          node --test scripts/release/test/worker-release.test.ts
          rustup target add wasm32-unknown-unknown
          cargo test --locked -p avesd-core -p avesd-worker
          cargo install --locked --version '=0.9.0' worker-build
          cd server/worker
          pnpm exec wrangler deploy --dry-run
      - name: Check that main still requests this release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          latest=$(gh api --method GET "repos/$GITHUB_REPOSITORY/contents/server/worker/version.json" \
            -f ref=main -H 'Accept: application/vnd.github.raw+json' | jq -er '.version | strings')
          if [[ "$latest" == "$RELEASE_VERSION" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Worker
        if: steps.current.outputs.deploy == 'true'
        working-directory: server/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing production account ID}"
          : "${CLOUDFLARE_API_TOKEN:?Missing production API token}"
          pnpm exec wrangler deploy --tag "$RELEASE_VERSION"
